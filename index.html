<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
      content="#0d47a1">

<title>نظام حضور الطلاب</title>

<link rel="manifest"
      href="manifest.json">

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Tahoma, sans-serif;
  background: #f1f5f9;
  color: #172033;
}

.container {
  width: 94%;
  max-width: 650px;
  margin: 25px auto;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 22px;
  margin-bottom: 18px;
  box-shadow: 0 5px 20px rgba(0,0,0,.08);
}

.header {
  text-align: center;
  background: linear-gradient(
    135deg,
    #0d47a1,
    #1976d2
  );
  color: white;
}

.logo {
  font-size: 45px;
}

h1 {
  margin: 5px 0;
  font-size: 25px;
}

h2 {
  font-size: 19px;
}

label {
  display: block;
  margin-bottom: 7px;
  font-weight: bold;
}

input,
select {
  width: 100%;
  padding: 13px;
  border: 1px solid #cbd5e1;
  border-radius: 10px;
  font-size: 16px;
  margin-bottom: 14px;
}

button {
  width: 100%;
  border: 0;
  border-radius: 11px;
  padding: 14px;
  font-size: 16px;
  cursor: pointer;
  margin-top: 5px;
}

.primary {
  background: #0d47a1;
  color: white;
}

.secondary {
  background: #e2e8f0;
  color: #172033;
}

.success {
  background: #16a34a;
  color: white;
}

.danger {
  background: #dc2626;
  color: white;
}

.info {
  background: #e0f2fe;
  border-right: 5px solid #0284c7;
  padding: 13px;
  border-radius: 10px;
  margin: 10px 0;
}

.warning {
  background: #fff7ed;
  border-right: 5px solid #f97316;
  padding: 13px;
  border-radius: 10px;
  margin: 10px 0;
}

.result {
  padding: 16px;
  border-radius: 12px;
  margin-top: 15px;
  text-align: center;
  font-weight: bold;
}

.hidden {
  display: none !important;
}

.student-info {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.info-box {
  background: #f8fafc;
  padding: 13px;
  border-radius: 10px;
}

.info-box small {
  display: block;
  color: #64748b;
  margin-bottom: 4px;
}

.info-box strong {
  font-size: 16px;
}

.lecture {
  background: #eff6ff;
  border: 1px solid #bfdbfe;
  border-radius: 12px;
  padding: 15px;
}

.footer {
  text-align: center;
  color: #64748b;
  font-size: 13px;
  padding: 10px;
}

</style>

</head>

<body>

<div class="container">

  <div class="card header">

    <div class="logo">🎓</div>

    <h1>نظام حضور الطلاب</h1>

    <div>جامعة تعز</div>

  </div>


  <div class="card">

    <h2>بيانات الطالب</h2>

    <label>الرقم الجامعي</label>

    <input
      id="studentId"
      type="text"
      placeholder="أدخل الرقم الجامعي">

    <button
      class="primary"
      onclick="loadStudent()">

      التحقق من الطالب

    </button>

  </div>


  <div
    id="studentCard"
    class="card hidden">

    <h2>معلومات الطالب</h2>

    <div class="student-info">

      <div class="info-box">
        <small>الرقم الجامعي</small>
        <strong id="studentIdText"></strong>
      </div>

      <div class="info-box">
        <small>الاسم</small>
        <strong id="studentName"></strong>
      </div>

      <div class="info-box">
        <small>المجموعة</small>
        <strong id="studentGroup"></strong>
      </div>

      <div class="info-box">
        <small>الأسبوع</small>
        <strong id="weekNumber"></strong>
      </div>

    </div>

  </div>


  <div
    id="lectureCard"
    class="card hidden">

    <h2>المحاضرة الحالية</h2>

    <div
      id="lectureBox"
      class="lecture">

      جاري البحث عن المحاضرة...

    </div>

    <button
      id="attendanceButton"
      class="primary"
      onclick="recordAttendance()">

      📍 تسجيل الحضور

    </button>

  </div>


  <div
    id="gpsCard"
    class="card hidden">

    <h2>التحقق من الموقع</h2>

    <div
      id="gpsStatus"
      class="info">

      سيتم التحقق من موقعك عند تسجيل الحضور.

    </div>

  </div>


  <div
    id="result"
    class="result hidden">
  </div>


  <div class="card">

    <h2>حالة الاتصال</h2>

    <div
      id="connectionStatus"
      class="info">

      جاري التحقق...

    </div>

    <button
      class="secondary"
      onclick="syncPending()">

      🔄 مزامنة العمليات المعلقة

    </button>

  </div>


  <div class="footer">
    نظام حضور الطلاب © 2026
  </div>

</div>


<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbxak31kru9o1TpgPIZHqhkXqfSJwxbOjChUDpzLFTZDF2f2LxnsjPkabYcpLqySP3A/exec";

const SEMESTER_START =
"2026-10-04";

const MAX_GPS_ACCURACY_METERS =
150;


/* =====================================================
   IndexedDB
   ===================================================== */

const DB_NAME =
"TaizAttendanceDB";

const DB_VERSION = 5;

let db;


function openDB() {

  return new Promise(
    (resolve, reject) => {

      const request =
        indexedDB.open(
          DB_NAME,
          DB_VERSION
        );

      request.onupgradeneeded =
        event => {

          const database =
            event.target.result;

          if (
            !database.objectStoreNames.contains(
              "pendingAttendance"
            )
          ) {

            database.createObjectStore(
              "pendingAttendance",
              {
                keyPath: "id",
                autoIncrement: true
              }
            );

          }

          if (
            !database.objectStoreNames.contains(
              "studentCache"
            )
          ) {

            database.createObjectStore(
              "studentCache",
              {
                keyPath: "studentId"
              }
            );

          }

          if (
            !database.objectStoreNames.contains(
              "meta"
            )
          ) {

            database.createObjectStore(
              "meta",
              {
                keyPath: "key"
              }
            );

          }

        };


      request.onsuccess =
        event => {

          db =
            event.target.result;

          resolve(db);

        };


      request.onerror =
        () => reject(
          request.error
        );

    }
  );

}


/* =====================================================
   Device ID
   ===================================================== */

async function getDeviceId() {

  await openDB();

  return new Promise(
    (resolve, reject) => {

      const tx =
        db.transaction(
          "meta",
          "readonly"
        );

      const store =
        tx.objectStore(
          "meta"
        );

      const request =
        store.get("deviceId");


      request.onsuccess =
        () => {

          if (request.result) {

            resolve(
              request.result.value
            );

            return;

          }


          const id =
            "WEB-" +
            crypto.randomUUID();


          const write =
            db.transaction(
              "meta",
              "readwrite"
            );


          write
            .objectStore("meta")
            .put({

              key:
                "deviceId",

              value:
                id

            });


          resolve(id);

        };


      request.onerror =
        () => reject(
          request.error
        );

    }
  );

}


/* =====================================================
   API
   ===================================================== */

async function apiGet(params) {

  const url =
    API_URL +
    "?" +
    new URLSearchParams(
      params
    ).toString();

  const response =
    await fetch(
      url,
      {
        method: "GET",
        cache: "no-store"
      }
    );

  if (!response.ok) {
    throw new Error(
      "HTTP " + response.status
    );
  }

  return response.json();

}


async function apiPost(data) {

  const response =
    await fetch(
      API_URL,
      {
        method: "POST",
        headers: {
          "Content-Type":
            "text/plain;charset=utf-8"
        },
        body:
          JSON.stringify(data)
      }
    );

  if (!response.ok) {
    throw new Error(
      "HTTP " + response.status
    );
  }

  return response.json();

}


/* =====================================================
   بيانات الطالب
   ===================================================== */

let currentStudent = null;
let currentLecture = null;


async function loadStudent() {

  const id =
    document
      .getElementById(
        "studentId"
      )
      .value
      .trim();


  if (!id) {

    showResult(
      "أدخل الرقم الجامعي أولًا",
      "warning"
    );

    return;

  }


  showResult(
    "جاري التحقق من بيانات الطالب...",
    "info"
  );


  try {

    const data =
      await apiGet({

        action:
          "student",

        studentId:
          id

      });


    if (!data.success) {

      showResult(
        data.message ||
        "الطالب غير موجود",
        "danger"
      );

      return;

    }


    currentStudent =
      data.student;


    document
      .getElementById(
        "studentCard"
      )
      .classList
      .remove("hidden");


    document
      .getElementById(
        "studentIdText"
      )
      .textContent =
        currentStudent.StudentID;


    document
      .getElementById(
        "studentName"
      )
      .textContent =
        currentStudent.Name;


    document
      .getElementById(
        "studentGroup"
      )
      .textContent =
        currentStudent.Group;


    const dateInfo =
      await apiGet({

        action:
          "dateInfo"

      });


    document
      .getElementById(
        "weekNumber"
      )
      .textContent =
        dateInfo.week || 0;


    await loadCurrentLecture();


  } catch (error) {

    console.error(error);

    showResult(
      "تعذر الاتصال بالخادم",
      "danger"
    );

  }

}


/* =====================================================
   المحاضرة الحالية
   ===================================================== */

async function loadCurrentLecture() {

  const card =
    document
      .getElementById(
        "lectureCard"
      );

  const box =
    document
      .getElementById(
        "lectureBox"
      );


  card.classList.remove(
    "hidden"
  );


  try {

    const data =
      await apiGet({

        action:
          "currentLecture",

        studentId:
          currentStudent.StudentID

      });


    if (
      !data.success
    ) {

      currentLecture =
        null;

      box.textContent =
        data.message ||
        "لا توجد محاضرة متاحة.";

      return;

    }


    currentLecture =
      data.lecture;


    if (!currentLecture) {

      box.textContent =
        data.message ||
        "لا توجد محاضرة متاحة لك الآن.";

      return;

    }


    box.innerHTML =

      "<strong>" +
      escapeHtml(
        currentLecture.subject
      ) +
      "</strong>" +

      "<br>المحاضرة: " +
      escapeHtml(
        currentLecture.lectureId
      ) +

      "<br>الوقت: " +
      escapeHtml(
        currentLecture.start
      ) +
      " - " +
      escapeHtml(
        currentLecture.end
      );


  } catch (error) {

    box.textContent =
      "تعذر تحميل المحاضرة.";

  }

}


/* =====================================================
   GPS
   ===================================================== */

function getGPS() {

  return new Promise(
    (resolve, reject) => {

      if (
        !navigator.geolocation
      ) {

        reject(
          new Error(
            "GPS غير مدعوم"
          )
        );

        return;

      }


      navigator.geolocation.getCurrentPosition(

        position => {

          resolve({

            latitude:
              position.coords.latitude,

            longitude:
              position.coords.longitude,

            accuracy:
              position.coords.accuracy

          });

        },

        error => {

          reject(error);

        },

        {

          enableHighAccuracy:
            true,

          timeout:
            20000,

          maximumAge:
            0

        }

      );

    }
  );

}


/* =====================================================
   تسجيل الحضور
   ===================================================== */

async function recordAttendance() {

  if (!currentStudent) {

    showResult(
      "تحقق من بيانات الطالب أولًا",
      "warning"
    );

    return;

  }


  if (!currentLecture) {

    showResult(
      "لا توجد محاضرة متاحة لك الآن",
      "warning"
    );

    return;

  }


  const button =
    document
      .getElementById(
        "attendanceButton"
      );


  button.disabled =
    true;


  showResult(
    "جاري الحصول على الموقع...",
    "info"
  );


  try {

    const gps =
      await getGPS();


    document
      .getElementById(
        "gpsCard"
      )
      .classList
      .remove("hidden");


    document
      .getElementById(
        "gpsStatus"
      )
      .innerHTML =

      "دقة GPS: " +
      Math.round(
        gps.accuracy
      ) +
      " متر";


    if (
      gps.accuracy >
      MAX_GPS_ACCURACY_METERS
    ) {

      showResult(
        "دقة GPS غير كافية. حاول الحصول على موقع أدق.",
        "warning"
      );

      return;

    }


    const deviceId =
      await getDeviceId();


    const payload = {

      action:
        "attendance",

      studentId:
        currentStudent.StudentID,

      lectureId:
        currentLecture.lectureId,

      latitude:
        gps.latitude,

      longitude:
        gps.longitude,

      accuracy:
        gps.accuracy,

      deviceId:
        deviceId

    };


    /*
     * مهم:
     * لا نسجل حضورًا محليًا دون GPS.
     * إذا كان الإنترنت غير متوفر،
     * نطلب GPS الآن ثم نخزن الإحداثيات.
     */

    if (
      !navigator.onLine
    ) {

      await savePending(
        payload
      );


      showResult(
        "لا يوجد اتصال بالإنترنت. تم حفظ العملية وسيتم إرسالها عند عودة الاتصال.",
        "warning"
      );

      return;

    }


    const response =
      await apiPost(
        payload
      );


    if (
      response.success
    ) {

      showResult(
        "✅ " +
        response.message,
        "success"
      );

      return;

    }


    showResult(
      response.message ||
      "لم يتم تسجيل الحضور",
      "danger"
    );


  } catch (error) {

    console.error(error);


    if (
      !navigator.onLine
    ) {

      try {

        const gps =
          await getGPS();

        const deviceId =
          await getDeviceId();


        await savePending({

          action:
            "attendance",

          studentId:
            currentStudent.StudentID,

          lectureId:
            currentLecture.lectureId,

          latitude:
            gps.latitude,

          longitude:
            gps.longitude,

          accuracy:
            gps.accuracy,

          deviceId:
            deviceId

        });


        showResult(
          "تم حفظ العملية محليًا وسيتم إرسالها عند عودة الإنترنت.",
          "warning"
        );


      } catch (offlineError) {

        showResult(
          "تعذر الحصول على الموقع.",
          "danger"
        );

      }

    } else {

      showResult(
        "تعذر الحصول على الموقع أو الاتصال بالخادم.",
        "danger"
      );

    }


  } finally {

    button.disabled =
      false;

  }

}


/* =====================================================
   IndexedDB - العمليات المعلقة
   ===================================================== */

async function savePending(data) {

  await openDB();

  return new Promise(
    (resolve, reject) => {

      const tx =
        db.transaction(
          "pendingAttendance",
          "readwrite"
        );

      tx.objectStore(
        "pendingAttendance"
      ).add({

        ...data,

        createdAt:
          new Date().toISOString()

      });


      tx.oncomplete =
        () => resolve();


      tx.onerror =
        () => reject(
          tx.error
        );

    }
  );

}


async function getPending() {

  await openDB();

  return new Promise(
    (resolve, reject) => {

      const tx =
        db.transaction(
          "pendingAttendance",
          "readonly"
        );


      const request =
        tx.objectStore(
          "pendingAttendance"
        ).getAll();


      request.onsuccess =
        () =>
          resolve(
            request.result
          );


      request.onerror =
        () =>
          reject(
            request.error
          );

    }
  );

}


async function deletePending(id) {

  await openDB();

  return new Promise(
    (resolve, reject) => {

      const tx =
        db.transaction(
          "pendingAttendance",
          "readwrite"
        );


      tx.objectStore(
        "pendingAttendance"
      ).delete(id);


      tx.oncomplete =
        () => resolve();


      tx.onerror =
        () => reject(
          tx.error
        );

    }
  );

}


/* =====================================================
   المزامنة
   ===================================================== */

async function syncPending() {

  if (!navigator.onLine) {

    showResult(
      "لا يوجد اتصال بالإنترنت.",
      "warning"
    );

    return;

  }


  const items =
    await getPending();


  if (!items.length) {

    showResult(
      "لا توجد عمليات معلقة.",
      "info"
    );

    return;

  }


  let synced = 0;


  for (
    const item of items
  ) {

    try {

      const response =
        await apiPost({

          action:
            "attendance",

          studentId:
            item.studentId,

          lectureId:
            item.lectureId,

          latitude:
            item.latitude,

          longitude:
            item.longitude,

          accuracy:
            item.accuracy,

          deviceId:
            item.deviceId

        });


      /*
       * إذا نجح التسجيل أو كان
       * مسجلًا مسبقًا، نحذف العملية
       * من قائمة الانتظار.
       */

      if (
        response.success ||
        response.code === "DUPLICATE"
      ) {

        await deletePending(
          item.id
        );

        synced++;

      }

    } catch (error) {

      console.log(
        "Sync error:",
        error
      );

    }

  }


  showResult(
    "تمت مزامنة " +
    synced +
    " عملية.",
    "success"
  );

}


/* =====================================================
   حالة الاتصال
   ===================================================== */

function updateConnectionStatus() {

  const element =
    document
      .getElementById(
        "connectionStatus"
      );


  if (
    navigator.onLine
  ) {

    element.textContent =
      "🟢 متصل بالإنترنت";

  } else {

    element.textContent =
      "🔴 غير متصل بالإنترنت";

  }

}


/* =====================================================
   النتيجة
   ===================================================== */

function showResult(
  message,
  type
) {

  const element =
    document
      .getElementById(
        "result"
      );


  element.textContent =
    message;


  element.className =
    "result";


  if (
    type === "success"
  ) {

    element.style.background =
      "#dcfce7";

    element.style.color =
      "#166534";

  }

  else if (
    type === "danger"
  ) {

    element.style.background =
      "#fee2e2";

    element.style.color =
      "#991b1b";

  }

  else if (
    type === "warning"
  ) {

    element.style.background =
      "#ffedd5";

    element.style.color =
      "#9a3412";

  }

  else {

    element.style.background =
      "#e0f2fe";

    element.style.color =
      "#075985";

  }


  element.classList.remove(
    "hidden"
  );

}


/* =====================================================
   حماية HTML
   ===================================================== */

function escapeHtml(value) {

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


/* =====================================================
   الأحداث
   ===================================================== */

window.addEventListener(
  "online",
  () => {

    updateConnectionStatus();

    syncPending();

  }
);


window.addEventListener(
  "offline",
  updateConnectionStatus
);


/* =====================================================
   Service Worker
   ===================================================== */

if (
  "serviceWorker" in navigator
) {

  window.addEventListener(
    "load",
    () => {

      navigator.serviceWorker
        .register(
          "./sw.js",
          {
            scope: "./"
          }
        )
        .catch(
          error =>
            console.log(
              "SW:",
              error
            )
        );

    }
  );

}


/* =====================================================
   البداية
   ===================================================== */

window.addEventListener(
  "load",
  async () => {

    await openDB();

    updateConnectionStatus();

    if (
      navigator.onLine
    ) {

      syncPending();

    }

  }
);

</script>

</body>
</html>
